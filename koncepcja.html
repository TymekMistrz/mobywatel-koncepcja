<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Koncepcja aplikacji obywatelskiej — prototyp</title>
<style>
/* =========================================================
   WYGLĄD — zmieniaj kolory tutaj
   ========================================================= */
:root{
  --brand:#1d3f8f;        /* kolor marki / akcji */
  --brand-soft:#e8eefb;
  --bg:#f3f4f8;
  --card:#ffffff;
  --text:#14171f;
  --muted:#5b6475;        /* kontrast ≥ 4.5:1 na białym */
  --line:#e3e6ee;
  --ok:#1b7a3d;  --ok-soft:#e6f4ea;
  --warn:#9a5b00; --warn-soft:#fff3dc;
  --bad:#b3122e;  --bad-soft:#fde8ec;   /* czerwony TYLKO dla pilnych spraw */
  --fs:17px;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#dfe3ec;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
:focus-visible{outline:3px solid #f5b700;outline-offset:2px;border-radius:8px}

/* ---------- scena: panel prezentera + telefon ---------- */
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding:32px}
.presenter{width:340px;max-height:calc(100vh - 64px);overflow:auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 40px rgba(20,30,60,.12);font-size:14px}
.presenter h1{font-size:18px;margin-bottom:4px}
.presenter .sub{color:var(--muted);margin-bottom:16px;line-height:1.4}
.presenter h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;background:#fff}
.pbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.why{background:var(--brand-soft);border-radius:12px;padding:12px 14px;line-height:1.45;color:#1b2a4a}
.why b{display:block;margin-bottom:4px}
.why ul{padding-left:18px}
.device{width:390px;height:844px;border-radius:54px;background:#111;padding:12px;box-shadow:0 30px 80px rgba(10,20,50,.35);flex-shrink:0}
.screen{width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);position:relative;font-size:var(--fs);display:flex;flex-direction:column}
@media (max-width:820px){
  .stage{padding:0;display:block}
  .presenter{display:none}
  .device{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
}

/* ---------- tryby dostępności ---------- */
.screen.large{--fs:21px}
.screen.contrast{--bg:#fff;--muted:#2b2f38;--line:#5b6475;--brand:#0b2466;--brand-soft:#dfe7fb}
.screen.contrast .card,.screen.contrast .row{border:2px solid #14171f}

/* ---------- elementy aplikacji ---------- */
.status{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:15px;font-weight:600}
.topbar{display:flex;align-items:center;gap:10px;padding:6px 18px 10px;flex-shrink:0}
.topbar h1{font-size:1.45em;flex:1;letter-spacing:-.01em}
.back{display:flex;align-items:center;gap:4px;color:var(--brand);font-weight:600;padding:8px 6px 8px 0;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);position:relative}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--card)}
.body{flex:1;overflow-y:auto;padding:4px 18px 120px;-webkit-overflow-scrolling:touch}
.section{font-size:.82em;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 4px 10px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.list{background:var(--card);border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:60px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:600;line-height:1.25}
.row .s{color:var(--muted);font-size:.86em;margin-top:2px;line-height:1.3}
.row .grow{flex:1;min-width:0}
.chev{color:var(--muted);flex-shrink:0}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--brand-soft);color:var(--brand);font-size:20px}
.ico.bad{background:var(--bad-soft);color:var(--bad)} .ico.warn{background:var(--warn-soft);color:var(--warn)} .ico.ok{background:var(--ok-soft);color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8em;font-weight:700;border-radius:999px;padding:4px 10px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;background:var(--brand);color:#fff;font-weight:700;padding:0 18px;margin-top:10px;text-align:center}
.btn.sec{background:var(--card);color:var(--brand);border:2px solid var(--brand-soft)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.danger{background:var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}
.muted{color:var(--muted)}
p.lead{line-height:1.45;margin:4px 4px 14px}
.hello{font-size:1.5em;font-weight:800;margin:6px 4px 2px;letter-spacing:-.01em}

/* zadania na teraz */
.task{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px;border-left:6px solid transparent}
.task.bad{border-left-color:var(--bad)} .task.warn{border-left-color:#e19a1c} .task.info{border-left-color:var(--brand)}
.task .t{font-weight:700;line-height:1.25}
.task .s{color:var(--muted);font-size:.88em;margin-top:4px;line-height:1.35}
.task .cta{display:inline-block;margin-top:10px;font-weight:700;color:var(--brand)}

/* karty dokumentów (miniatury) */
.docs-h{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin:0 -18px;padding-left:18px;scrollbar-width:none}
.mini{flex:0 0 150px;height:96px;border-radius:16px;color:#fff;padding:12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.mini b{font-size:.88em;line-height:1.2}
.mini .st{font-size:.72em;font-weight:700;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 8px;align-self:flex-start}
.mini .st.bad{background:#fff;color:var(--bad)} .mini .st.warn{background:#fff;color:var(--warn)}
.g-dowod{background:linear-gradient(135deg,#2257c9,#163a8a)}
.g-prawo{background:linear-gradient(135deg,#a23b72,#6c2350)}
.g-auto{background:linear-gradient(135deg,#d9731e,#a24e0c)}
.g-kdr{background:linear-gradient(135deg,#6a46c2,#432a87)}
.g-leg{background:linear-gradient(135deg,#127c72,#0b544d)}

/* duża karta dokumentu */
.bigdoc{border-radius:22px;color:#fff;padding:20px;min-height:210px;display:flex;flex-direction:column;gap:14px;margin-bottom:12px}
.bigdoc .name{font-size:1.25em;font-weight:800;letter-spacing:.02em}
.bigdoc .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.bigdoc .k{font-size:.72em;opacity:.85}
.bigdoc .v{font-weight:700}
.avatar{width:64px;height:80px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1.6em;font-weight:800;flex-shrink:0}

/* usługi */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;min-height:52px;margin:4px 0 6px;border:2px solid var(--line)}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:1em;min-height:48px;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font-size:.9em;min-height:40px}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700}

/* pasek zakładek */
.tabbar{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 6px 26px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0;min-height:52px;position:relative}
.screen.large .tab{font-size:13px}
.tab.on{color:var(--brand)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.fab{position:absolute;right:16px;bottom:96px;z-index:6;display:flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border-radius:999px;padding:0 18px 0 14px;height:54px;font-weight:700;box-shadow:0 8px 24px rgba(29,63,143,.35)}

/* przepływy */
.progress{display:flex;gap:6px;margin:4px 4px 16px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--brand)}
.q{font-size:1.35em;font-weight:800;margin:4px 4px 6px;line-height:1.2}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);flex-shrink:0;display:grid;place-items:center;color:#fff;margin-top:1px}
.opt.radio .box{border-radius:50%}
.opt.on .box{background:var(--brand);border-color:var(--brand)}
.opt .t{font-weight:700}
.opt .s{color:var(--muted);font-size:.86em;margin-top:3px;line-height:1.35}
.note{border-radius:14px;padding:12px 14px;font-size:.9em;line-height:1.4;margin:6px 0 12px}
.note.info{background:var(--brand-soft);color:#1b2a4a}
.note.warn{background:var(--warn-soft);color:#5c3a00}
.note.bad{background:var(--bad-soft);color:#7a0c20}
.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right}
.timeline{margin:6px 4px}
.tl{display:flex;gap:12px;padding-bottom:16px;position:relative}
.tl:before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl:last-child:before{display:none}
.tl .dotb{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex-shrink:0;color:#fff;font-size:14px}
.tl.done .dotb{background:var(--ok)}
.tl.now .dotb{background:var(--brand)}
.success{text-align:center;padding:26px 8px 8px}
.success .big{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px;font-size:42px}

/* nakładki */
.overlay{position:absolute;inset:0;background:rgba(10,15,30,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;border-radius:26px 26px 0 0;max-height:94%;display:flex;flex-direction:column;animation:up .25s ease}
.sheet.full{height:94%}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:44px;height:5px;border-radius:3px;background:#c4c9d4;margin:8px auto 4px}
.sheet-h{display:flex;align-items:center;padding:6px 16px 8px;gap:10px}
.sheet-h h2{flex:1;font-size:1.2em}
.modal{margin:auto;background:#fff;border-radius:24px;width:84%;padding:26px 22px;text-align:center;animation:up .2s ease}
.face{width:86px;height:86px;border-radius:24px;border:3px solid var(--brand);margin:6px auto 14px;display:grid;place-items:center;font-size:40px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:sp 0.8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:absolute;left:16px;right:16px;bottom:104px;background:#14171f;color:#fff;border-radius:14px;padding:14px 16px;z-index:30;font-size:.92em;animation:up .2s ease}

/* czat */
.chat{flex:1;overflow-y:auto;padding:8px 16px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;line-height:1.4;padding:11px 14px;border-radius:18px}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.msg .card{margin:10px 0 0;padding:12px;border:1.5px solid var(--line)}
.msg .btn{min-height:46px;margin-top:8px}
.composer{display:flex;gap:8px;padding:10px 12px 28px;background:var(--card);border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:2px solid var(--line);border-radius:999px;padding:0 16px;min-height:48px;background:var(--bg);color:var(--text)}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;flex-shrink:0}
.round.sec{background:var(--brand-soft);color:var(--brand)}
.listening{animation:pulse 1s ease infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(29,63,143,.15)}}

/* tryb seniora */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:22px;min-height:140px;padding:18px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-weight:800;font-size:1.05em;line-height:1.2}
.tile .e{font-size:2em}
.tile.wide{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:center;gap:16px;background:var(--brand);color:#fff}
.qr{width:200px;height:200px;margin:8px auto;display:grid;grid-template-columns:repeat(21,1fr);background:#fff;padding:10px;border-radius:14px}
.qr i{background:#fff}.qr i.b{background:#111}
.switch{width:52px;height:32px;border-radius:999px;background:#c4c9d4;position:relative;flex-shrink:0;transition:.2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)} .switch.on:after{left:23px}
.concept{font-size:11px;text-align:center;color:var(--muted);padding:4px 0 0}
</style>
</head>
<body>
<div class="stage">
  <aside class="presenter" aria-label="Panel prezentera">
    <h1>Koncepcja: aplikacja obywatelska</h1>
    <p class="sub">Klikalny prototyp. Panel po lewej jest tylko dla prezentacji (jury) — w telefonie go nie ma.</p>
    <h3>Osoba</h3><div class="pbtns" id="p-persona"></div>
    <h3>Przesuń czas (testuj terminy)</h3><div class="pbtns" id="p-time"></div>
    <h3>Dostępność</h3><div class="pbtns" id="p-a11y"></div>
    <h3>Scenariusze — skróty</h3><div class="pbtns" id="p-scen"></div>
    <h3>Dlaczego ten ekran tak wygląda</h3><div class="why" id="p-why"></div>
    <h3>&nbsp;</h3><button class="pbtn" data-a="reset">↺ Zacznij od nowa</button>
  </aside>
  <div class="device"><div class="screen" id="app"></div></div>
</div>

<script>
/* =========================================================

   Daty są liczone względem DZISIAJ (liczba dni), więc

/* Katalog usług — wyszukiwarka rozumie potoczne słowa (tags) */
const SERVICES = [

const DAY = 864e5;
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return new Date(d.getTime()+S.shift*DAY); };
const inDays = n => new Date(today().getTime()+n*DAY - S.shift*DAY); // data stała względem „prawdziwego” dziś
const fmt = d => d.toLocaleDateString("pl-PL",{day:"2-digit",month:"2-digit",year:"numeric"});
const left = d => Math.round((d - today())/DAY);
const dni = n => n===1?"1 dzień":`${n} dni`;
function status(validDays){
  if(validDays==null) return {cls:"ok", txt:"Ważny bezterminowo", short:"Ważny"};
  const d=inDays(validDays), n=left(d);
  if(n<0) return {cls:"bad", txt:`Wygasł ${fmt(d)} (${dni(-n)} temu)`, short:"Wygasł", n};
  if(n===0) return {cls:"bad", txt:`Wygasa dziś`, short:"Dziś", n};
  if(n<=45) return {cls:"warn", txt:`Wygasa za ${dni(n)} (${fmt(d)})`, short:`${dni(n)}`, n};
  return {cls:"ok", txt:`Ważny do ${fmt(d)}`, short:"Ważny", n};
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* =========================================================
   4. „NA TERAZ” — zadania liczone z dat
   ========================================================= */
function tasks(){
  const p=P(), out=[];
  p.docs.forEach(d=>{
    if(d.isCar){
      const oc=status(d.ocDays);
      if(oc.cls!=="ok") out.push({lvl:oc.cls, ico:"🚗", n:oc.n,
        t: oc.cls==="bad" ? `Brak ważnego OC — ${d.short}` : `OC ${d.short} kończy się za ${dni(oc.n)}`,
        s: oc.cls==="bad" ? "Nie jedź tym autem, dopóki nie przedłużysz OC — grozi wysoka kara z UFG." : `Sprawdź, czy umowa przedłuży się sama (${fmt(inDays(d.ocDays))}).`,
        cta: oc.cls==="bad" ? "Co teraz zrobić" : "Sprawdź OC", a:"flow:oc"});
      const ins=status(d.inspDays);
      if(ins.cls!=="ok") out.push({lvl:ins.cls, ico:"🔧", n:ins.n, t:`Badanie techniczne ${ins.cls==="bad"?"nieważne":"za "+dni(ins.n)}`, s:d.short, cta:"Szczegóły", a:"doc:"+d.id});
      return;
    }
    if(S.done.portfel && d.id==="dowod") return;
    const st=status(d.validDays);
    if(st.cls!=="ok") out.push({lvl:st.cls, ico:"🪪", n:st.n, t:`${d.type}: ${st.cls==="bad"?"stracił ważność":"traci ważność za "+dni(st.n)}`,
      s: st.cls==="bad" ? "Złóż wniosek o nowy — zajmie to 3 minuty." : "Wniosek złożysz w aplikacji. Odbiór w urzędzie.", cta:"Złóż wniosek", a:"flow:dowod"});
  });
  allInbox().forEach(m=>{
    if(m.dueDays==null || S.done[m.id]) return;
    const d=inDays(m.dueDays), n=left(d);
    out.push({lvl: n<0?"bad": n<=7?"warn":"info", ico:"✉️", n, t:m.title,
      s: n<0 ? `Termin minął ${fmt(d)} — załatw to jak najszybciej` : `${m.from} · termin ${fmt(d)} (za ${dni(n)})`, cta:"Otwórz", a:"msg:"+m.id});
  });
  return out.sort((a,b)=>(a.n??999)-(b.n??999));
}
const allInbox = () => [...S.extraInbox.filter(m=>m.pid===S.pid), ...P().inbox];
const unread = () => allInbox().filter(m=>m.unread && !S.done["read_"+m.id]).length;

    ${m.dueDays!=null&&!S.done[m.id]?`<div class="note ${left(inDays(m.dueDays))<=7?"warn":"info"}"><b>Termin: ${fmt(inDays(m.dueDays))}</b> (za ${dni(Math.max(0,left(inDays(m.dueDays))))})</div>`:""}

function opt(f,key,val,t,s,disabled,multi){
  const on = multi ? (f[key]===undefined ? (f[key]=!!val) : f[key]) : f[key]===val;
  if(disabled) f[key]=true;
  return `<button class="opt ${multi?"":"radio"} ${on?"on":""}" ${disabled?'aria-disabled="true"':""} data-a="${disabled?"noop":`opt:${key}:${multi?"__t":val}`}" role="${multi?"checkbox":"radio"}" aria-checked="${!!on}"><span class="box">${on?I.check:""}</span><span><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:""}</span></button>`;
}
const ADDR=["ul. Kwiatowa 5/12, 02-580 Warszawa","ul. Kwiatowa 18, 05-500 Piaseczno","ul. Kwiatkowskiego 3/7, 03-984 Warszawa","ul. Długa 21/4, 31-147 Kraków","ul. Morska 9/2, 81-323 Gdynia"];
function addrSug(f){
  const q=(f.addr||"").toLowerCase().trim();
  if(f.addrPicked) return `<div class="note info">✓ Wybrano: <b>${f.addrPicked}</b></div>`;
  const l = q.length<2 ? [] : ADDR.filter(a=>a.toLowerCase().includes(q.replace("ul. ","").replace("ul ","")));
  return q.length<2 ? `<button class="chip" data-a="addrpick:0" style="margin:6px 0">Przykład: ${ADDR[0]}</button>` :
    `<div class="list">${(l.length?l:ADDR.slice(0,2)).map(a=>`<button class="row" data-a="addrpick:${ADDR.indexOf(a)}"><span class="ico">📍</span><span class="grow t">${a}</span></button>`).join("")}</div>`;
}
function addUpo(id,title){ S.extraInbox.unshift({pid:S.pid,id:"upo_"+id+Date.now(),from:"Potwierdzenie systemowe",title,dueDays:null,unread:true,plain:"Twój wniosek został złożony. To jest oficjalne potwierdzenie (UPO).",official:"Urzędowe Poświadczenie Odbioru. Identyfikator: "+Math.random().toString(36).slice(2,10).toUpperCase(),action:null}); }

function vFlow(){
  const F=FLOWS[S.flow.id], f=S.flow.data;
  if(S.flow.result){
    const r=S.flow.result;
    return `<div class="topbar"><span style="flex:1"></span><button class="iconbtn" data-a="closeflow" aria-label="Zamknij">${I.x}</button></div>
    <div class="body"><div class="success"><div class="big">✓</div><div class="q">${r.t}</div><p class="lead muted">${r.s}</p></div>
    ${r.tl?`<div class="card timeline">${r.tl.map(([a,b,d],i)=>`<div class="tl ${d?"done":i===r.tl.findIndex(x=>!x[2])?"now":""}"><span class="dotb">${d?"✓":""}</span><div><div style="font-weight:700">${a}</div><div class="muted" style="font-size:.86em">${b}</div></div></div>`).join("")}</div>`:""}
    ${r.next?`<button class="btn" data-a="${r.next.a}">${r.next.l}</button>`:""}
    <button class="btn ${r.next?"sec":""}" data-a="closeflow">Wróć do ekranu głównego</button></div>`;
  }
  const st=F.steps[S.flow.step], content=st.r(f), valid=st.ok(f), last=S.flow.step===F.steps.length-1;
  return `<div class="topbar"><button class="back" data-a="${S.flow.step?"prevstep":"closeflow"}">${I.back} ${S.flow.step?"Wstecz":"Anuluj"}</button><span style="flex:1;text-align:center;font-weight:700">${F.title}</span><span style="width:60px;text-align:right" class="muted">${S.flow.step+1}/${F.steps.length}</span></div>
  <div class="body">
    ${F.steps.length>1?`<div class="progress">${F.steps.map((_,i)=>`<i class="${i<=S.flow.step?"on":""}"></i>`).join("")}</div>`:""}
    ${content}
    <button class="btn ${st.danger?"danger":""}" data-a="${last?"confirm":"nextstep"}" ${valid?"":"disabled"}>${last?(st.confirm||"Wyślij"):"Dalej"}</button>
  </div>`;
}

/* =========================================================
   7. ASYSTENT — rozpoznaje intencję i uruchamia TEN SAM przepływ
   ========================================================= */
const INTENTS = [
  {re:/portfel|zgubi|ukrad|kradzie|zastrze/i, flow:"portfel", say:"Przykro mi. Najpierw zabezpieczmy dokumenty — zajmie to minutę. Nic nie zrobię bez Twojego potwierdzenia."},
  {re:/adres|przeprowadz|meldun|zamel|wymel/i, flow:"przeprowadzka", say:"Zmienię adres we wszystkich rejestrach naraz. Zapytam tylko o to, czego nie wiem."},
  {re:/\boc\b|ubezpiecz|polis/i, flow:"oc", say:()=>{const d=P().docs.find(x=>x.isCar); if(!d) return "Nie masz zarejestrowanego pojazdu."; const s=status(d.ocDays); return `OC dla ${d.short}: ${s.txt.toLowerCase()}.`;}},
  {re:/dow[oó]d|nowy dow|wa[zż]no[sś][cć]/i, flow:"dowod", say:()=>`Twój dowód: ${status(P().docs.find(d=>d.id==="dowod").validDays).txt.toLowerCase()}. Wniosek o nowy złożysz tutaj w 3 krokach.`},
  {re:/pismo|rozumie|urz[aą]d skarb|wezwanie/i, open:"msg:us", say:"To pismo w skrócie: urząd chce sprawdzić ulgę na dzieci za 2025. Wystarczy potwierdzić dane z rejestru."},
  {re:/co mam|do załatwienia|sprawy|terminy/i, list:true, say:()=>{const t=tasks(); return t.length?`Masz ${t.length} ${t.length===1?"sprawę":"sprawy"}. Najpilniejsze:`:"Nie masz teraz nic pilnego ✓";}},
  {re:/kto.*(sprawdza|dane)|prywatn/i, open:"privacy", say:"Oto lista instytucji, które sprawdzały Twoje dane w ostatnich 60 dniach."},
  {re:/pomoc|córk|syn|pełnomoc/i, flow:"helper", say:"Możesz dodać zaufaną osobę i ustalić, w czym może Ci pomagać."},
];
function botReply(text){
  const it=INTENTS.find(i=>i.re.test(text));
  if(!it){
    const words=text.toLowerCase().split(/\s+/).filter(w=>w.length>3);
    const hits=SERVICES.filter(s=>words.some(w=>(s.tags+" "+s.title).toLowerCase().includes(w.slice(0,5)))).slice(0,3);
    return {txt:`Tej sprawy nie załatwię jeszcze rozmową${hits.length?", ale te usługi mogą pasować:":". Zobacz pełną listę usług albo połącz się z konsultantem."}`,
      cards:hits.map(s=>({l:s.e+" "+s.title,a:"svc:"+s.id})).concat([{l:"Wszystkie usługi",a:"tab:uslugi",sec:true},{l:"📞 Porozmawiaj z konsultantem",a:"toast:Łączymy z infolinią… (w prototypie symulacja)",sec:true}])};
  }
  const say = typeof it.say==="function"?it.say():it.say;
  if(it.flow) return {txt:say, cards:[{l:"Zaczynamy →",a:"flow:"+it.flow}]};
  if(it.open) return {txt:say, cards:[{l:"Otwórz",a:it.open}]};
  if(it.list) return {txt:say, cards:tasks().slice(0,3).map(t=>({l:t.t,a:t.a,sec:true}))};
}
function vChat(){
  const sugg = S.a11y.senior ? ["Zgubiłem portfel","Mój dowód traci ważność","Kto sprawdzał moje dane"] : ["Zgubiłam portfel","Przeprowadzam się","Co mam do załatwienia?","Nie rozumiem pisma z urzędu"];
  return `<div class="overlay" data-a="closechat"><div class="sheet full" data-stop>
    <div class="grab"></div>
    <div class="sheet-h"><span class="ico">${I.spark}</span><h2>Asystent</h2><button class="iconbtn" data-a="closechat" aria-label="Zamknij asystenta">${I.x}</button></div>
    <div class="chat" id="chat" aria-live="polite">
      <div class="msg bot">W czym mogę pomóc? Możesz pisać albo mówić. <span class="muted">Nic nie wyślę bez Twojego potwierdzenia.</span></div>
      ${S.chat.map(m=>`<div class="msg ${m.me?"me":"bot"}">${esc(m.txt)}${(m.cards||[]).map(c=>`<button class="btn ${c.sec?"sec":""}" data-a="${c.a}">${esc(c.l)}</button>`).join("")}</div>`).join("")}
      ${S.chat.length?"":`<div class="chips">${sugg.map(s=>`<button class="chip" data-a="chatq:${s}">${s}</button>`).join("")}</div>`}
      ${S.typing?`<div class="msg bot muted">…</div>`:""}
    </div>
    <form class="composer" id="composer"><input id="chatin" placeholder="${S.listening?"Słucham…":"Napisz, co chcesz załatwić"}" aria-label="Wiadomość do asystenta" autocomplete="off">
      <button type="button" class="round sec ${S.listening?"listening":""}" data-a="mic" aria-label="Mów">${I.mic}</button>
      <button class="round" aria-label="Wyślij">${I.send}</button></form>
  </div></div>`;
}

/* =========================================================
   8. NAKŁADKI: potwierdzenie biometrią, kod QR
   ========================================================= */
function vConfirm(){
  return `<div class="overlay"><div class="modal" role="dialog" aria-label="Potwierdzenie">
    ${S.overlay.stage==="ask"?`<div class="face">🙂</div><div style="font-weight:800;font-size:1.15em">Potwierdź tożsamość</div><p class="muted" style="margin:8px 0 6px;line-height:1.4">Spójrz w telefon albo użyj odcisku palca.</p>
      <button class="btn" data-a="bio">Potwierdź biometrią</button><button class="btn sec" data-a="bio">Wpisz PIN</button><button class="btn ghost" data-a="closeoverlay">Anuluj</button>`
    :`<div class="spin"></div><p class="muted">Wysyłam…</p>`}
  </div></div>`;
}
function vQR(){
  let seed=S.share.length*7+3; const rnd=()=>((seed=(seed*9301+49297)%233280)/233280);
  const cells=[...Array(441)].map((_,i)=>{const x=i%21,y=(i/21)|0;const f=(a,b)=>x>=a&&x<a+7&&y>=b&&y<b+7;const fin=f(0,0)||f(14,0)||f(0,14);if(fin){const lx=x%14%7,ly=y%14%7;return (lx===0||lx===6||ly===0||ly===6||(lx>1&&lx<5&&ly>1&&ly<5))?1:0}return rnd()>.5?1:0;});
  const lbl={full:"Pełne dane",name:"Imię, nazwisko i zdjęcie",age:"Tylko: ukończone 18 lat"}[S.share];
  return `<div class="overlay" data-a="closeoverlay"><div class="sheet" data-stop style="padding:0 20px 34px;text-align:center">
    <div class="grab"></div><div class="q" style="margin-top:12px">Pokaż ten kod</div>
    <div class="qr" aria-label="Kod do sprawdzenia">${cells.map(c=>`<i class="${c?"b":""}"></i>`).join("")}</div>
    <span class="pill ok" style="font-size:.9em">Udostępniasz: ${lbl}</span>
    <p class="muted" style="margin:12px 0 0;font-size:.88em">Kod ważny 2 minuty. Zobaczysz, kto go zeskanował.</p>
    <button class="btn sec" data-a="closeoverlay">Zamknij</button></div></div>`;
}

/* =========================================================
   9. RENDER
   ========================================================= */
const $app=document.getElementById("app");
function current(){
  if(S.flow) return "flow";
  const top=S.stack[S.stack.length-1];
  return top ? top.split(":")[0] : S.tab;
}
function render(keepScroll){
  const body=$app.querySelector(".body"); const sc=keepScroll&&body?body.scrollTop:0;
  const a=S.a11y; $app.className="screen"+(a.large||P().senior&&a.senior?" large":"")+(a.contrast?" contrast":"");
  let view, top=S.stack[S.stack.length-1];
  if(S.flow) view=vFlow();
  else if(top){ const [k,arg]=top.split(":"); view={doc:vDoc,msg:vMsg,privacy:vPrivacy}[k](arg); }
  else view={start:vStart,dokumenty:vDokumenty,uslugi:vUslugi,skrzynka:vSkrzynka,profil:vProfil}[S.tab]();
  const showTabs=!S.flow;
  const tabs=[["start","Start",I.home],["dokumenty","Dokumenty",I.docs],["uslugi","Usługi",I.grid],["skrzynka","Skrzynka",I.mail],["profil","Profil",I.user]];
  $app.innerHTML = `<div class="status" aria-hidden="true"><span>${new Date().toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"})}</span><span>${S.shift?`⏩ +${S.shift} dni`:""}</span><span>●●● 🔋</span></div>
    ${view}
    ${showTabs&&!S.stack.length&&!(S.tab==="start"&&a.senior)?`<button class="fab" data-a="chat" aria-label="Otwórz asystenta">${I.spark} Zapytaj</button>`:""}
    ${showTabs?`<nav class="tabbar" aria-label="Główne">${tabs.map(([k,l,ic])=>`<button class="tab ${S.tab===k&&!S.stack.length?"on":""}" data-a="tab:${k}" ${S.tab===k?'aria-current="page"':""}>${ic}<span>${l}</span>${k==="skrzynka"&&unread()?`<span class="badge">${unread()}</span>`:""}</button>`).join("")}</nav>`:""}
    ${S.chatOpen?vChat():""}
    ${S.overlay?.type==="confirm"?vConfirm():""}${S.overlay?.type==="qr"?vQR():""}
    ${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:""}`;
  const nb=$app.querySelector(".body"); if(nb) nb.scrollTop=sc;
  const ch=document.getElementById("chat"); if(ch) ch.scrollTop=ch.scrollHeight;
  renderPresenter();
}

/* =========================================================
   10. AKCJE (kliknięcia)
   ========================================================= */
function go(push){ S.stack.push(push); render(); }
function startFlow(id,ref){
  S.chatOpen=false;
  if(FLOWS[id]?.redirect){ S.flow=null; go(FLOWS[id].redirect); return; }
  if(id==="oc" && !P().docs.some(d=>d.isCar)){ toast("Nie masz zarejestrowanego pojazdu."); return; }
  if(!FLOWS[id]){ toast("Ta usługa będzie dostępna w kolejnej wersji prototypu."); return; }
  S.flow={id,step:0,data:{ref},result:null}; render();
}
function toast(t){ S.toast=t; render(true); clearTimeout(toast.t); toast.t=setTimeout(()=>{S.toast=null;render(true)},2600); }
function send(text){
  if(!text.trim()) return;
  S.chat.push({me:1,txt:text}); S.typing=true; render();
  setTimeout(()=>{ S.typing=false; S.chat.push(botReply(text)); render(); },650);
}
const A = {
  tab:t=>{S.tab=t;S.stack=[];S.cat=null;render();},
  back:()=>{S.stack.pop();render();},
  doc:id=>{S.share="full";go("doc:"+id);},
  msg:id=>{S.chatOpen=false;go("msg:"+id);},
  privacy:()=>{S.chatOpen=false;go("privacy");},
  svc:id=>{const s=SERVICES.find(x=>x.id===id); s.flow?startFlow(s.flow):toast("„"+s.title+"” — dostępne w kolejnej wersji prototypu.");},
  cat:c=>{S.cat=S.cat===c?null:c;render(true);},
  flow:(id,ref)=>startFlow(id,ref),
  opt:(k,v)=>{const f=S.flow.data; f[k]= v==="__t"?!f[k]:v; render(true);},
  addrpick:i=>{S.flow.data.addrPicked=ADDR[+i];S.flow.data.addr=ADDR[+i];render(true);},
  nextstep:()=>{S.flow.step++;render();},
  prevstep:()=>{S.flow.step--;render();},
  closeflow:()=>{S.flow=null;S.stack=[];S.tab="start";render();},
  confirm:()=>{S.overlay={type:"confirm",stage:"ask"};render(true);},
  bio:()=>{S.overlay.stage="wait";render(true);setTimeout(()=>{S.overlay=null;S.flow.result=FLOWS[S.flow.id].done(S.flow.data);render();},1100);},
  closeoverlay:()=>{S.overlay=null;render(true);},
  share:k=>{S.share=k;render(true);},
  showqr:()=>{S.overlay={type:"qr"};render(true);},
  unlock:()=>{delete S.done.portfel;toast("Dowód odblokowany. Zastrzeżenie w bankach zdjęte.");},
  chat:()=>{S.chatOpen=true;render();setTimeout(()=>document.getElementById("chatin")?.focus(),50);},
  chatq:q=>{S.chatOpen=true;send(q);},
  closechat:()=>{S.chatOpen=false;render();},
  mic:()=>{S.listening=true;render();setTimeout(()=>{S.listening=false;send(S.a11y.senior?"Mój dowód traci ważność, co mam zrobić?":"Przeprowadzam się do nowego mieszkania");},1400);},
  a11y:k=>{S.a11y[k]=!S.a11y[k];if(k==="senior"&&S.a11y.senior)S.a11y.large=true;if(k==="senior"){S.tab="start";S.stack=[];}render(true);},
  callhelper:()=>{const h=P().helpers[0];toast(h?`Wysłano prośbę o pomoc do: ${h.name}. Zobaczy ją w swojej aplikacji.`:"Dodaj zaufaną osobę w Profilu.");},
  toast:t=>toast(t),
  noop:()=>{},
  persona:id=>{S.pid=id;S.tab="start";S.stack=[];S.flow=null;S.chat=[];S.chatOpen=false;S.a11y.senior=PERSONAS[id].senior;S.a11y.large=PERSONAS[id].senior;render();},
  shift:n=>{S.shift=+n;render(true);},
  reset:()=>location.reload(),
};
document.addEventListener("click",e=>{
  const stop=e.target.closest("[data-stop]"); const el=e.target.closest("[data-a]");
  if(!el) return;
  if(stop && !stop.contains(el)) return;
  if(el.classList.contains("overlay") && e.target!==el) return;
  e.preventDefault();
  const [a,...rest]=el.dataset.a.split(":"); A[a]?.(rest[0], rest.slice(1).join(":")||undefined, el);
});
// chatq potrzebuje całego tekstu (może zawierać dwukropki)
A.chatq=(q,rest)=>{S.chatOpen=true;send(rest?q+":"+rest:q);};
document.addEventListener("submit",e=>{ if(e.target.id==="composer"){ e.preventDefault(); const i=document.getElementById("chatin"); send(i.value); }});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ S.query=e.target.value; const pos=e.target.selectionStart; render(true); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos); }
  if(e.target.id==="addr"){ S.flow.data.addr=e.target.value; S.flow.data.addrPicked=null; document.getElementById("addr-sug").innerHTML=addrSug(S.flow.data); const b=$app.querySelector('[data-a="nextstep"]'); b&&(b.disabled=true); }
  if(e.target.id==="hname"){ S.flow.data.h=e.target.value; }
});

/* =========================================================
   11. PANEL PREZENTERA (tylko na komputerze)
   ========================================================= */
function renderPresenter(){
  const pb=(on,a,l)=>`<button class="pbtn ${on?"on":""}" data-a="${a}">${l}</button>`;
  document.getElementById("p-persona").innerHTML=Object.entries(PERSONAS).map(([k,p])=>pb(S.pid===k,"persona:"+k,`${p.first}, ${p.age} · ${p.city}`)).join("")+`<div class="muted" style="width:100%;margin-top:4px">${P().note}</div>`;
  document.getElementById("p-time").innerHTML=[0,7,14,30].map(n=>pb(S.shift===n,"shift:"+n,n?`+${n} dni`:"Dziś")).join("");
  document.getElementById("p-a11y").innerHTML=[["large","Duży tekst"],["contrast","Kontrast"],["simple","Prosty język"],["senior","Tryb uproszczony"]].map(([k,l])=>pb(S.a11y[k],"a11y:"+k,l)).join("");
  document.getElementById("p-scen").innerHTML=[["flow:przeprowadzka","🏠 Przeprowadzka"],["flow:portfel","👛 Zgubiony portfel"],["chatq:Jak zmienić adres zameldowania?","💬 Asystent: meldunek"],["chatq:Chcę zarejestrować łódkę","💬 Asystent: coś, czego nie umie"],["msg:"+P().inbox[0].id,"✉️ Pismo po ludzku"],["privacy","🔒 Kto sprawdzał dane"]].map(([a,l])=>pb(false,a,l)).join("");
  let k=current(); if(S.chatOpen)k="chat"; if(k==="start"&&S.a11y.senior)k="senior";
  const w=WHY[k]||WHY.start;
  document.getElementById("p-why").innerHTML=`<b>${w[0]}</b><ul>${w.slice(1).map(x=>`<li>${x}</li>`).join("")}</ul>`;
}
render();
</script>
