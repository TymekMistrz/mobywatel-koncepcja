<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mObywatel</title>
<link rel="icon" href="assets/icon-app.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Na telefonie nie pokazujemy ramki — od razu sama aplikacja */
if(Math.min(innerWidth,screen.width)<820)location.replace('app.html'+location.search);
</script>
<style>
/* =========================================================
   WYGLĄD PANELU I RAMKI — kolory zmieniasz tutaj
   ========================================================= */
:root{--red:#dc143c;--ink:#16181d;--ink2:#5d6472;--line:#e4e6ec;--bg:#f1f2f6;--card:#fff;--sans:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(1200px 700px at 72% 45%,#ffffff 0%,#e9ebf0 55%,#dcdfe6 100%);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #f5b700;outline-offset:2px;border-radius:10px}

.stage{height:100vh;display:grid;grid-template-columns:minmax(340px,400px) 1fr;gap:20px;padding:16px 24px}

/* ---------- panel po lewej: wszystko mieści się bez przewijania ---------- */
.panel{background:var(--card);border-radius:22px;box-shadow:0 10px 40px rgba(20,30,60,.10);padding:16px 18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px}
.brand h1{font-size:15.5px;line-height:1.2;margin:0}
.h{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:14px 2px 7px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.person{display:flex;gap:9px;align-items:center;text-align:left;padding:7px 9px;border-radius:13px;border:2px solid var(--line);background:#fff;min-width:0}
.person:hover{border-color:#c9ccd6}
.person.on{border-color:var(--red);background:#fff5f7}
.person .av{width:32px;height:32px;border-radius:50%;background:#dfe4ee center 20%/cover;flex-shrink:0}
.person span{min-width:0}
.person b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person small{display:block;color:var(--ink2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.datebox{background:var(--bg);border-radius:14px;padding:11px 13px 12px}
.date{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.date b{font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.date span{color:var(--ink2);font-size:12px;font-weight:700;white-space:nowrap}
input[type=range]{width:100%;margin:8px 0 4px;accent-color:var(--red);height:22px}
.chips{display:flex;gap:5px}
.chip{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 0;font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.events{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;overflow:hidden}
.ev{display:flex;gap:9px;align-items:center;text-align:left;padding:7px 10px;border-radius:11px;background:#fff;border:1.5px solid var(--line);font-size:13px;flex-shrink:0}
.ev:hover{border-color:#c9ccd6}
.ev i{font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:3px 7px;white-space:nowrap;min-width:68px;text-align:center}
.ev .ok{background:#e7f4ea;color:#1b7a3d}.ev .warn{background:#fff3dc;color:#8a5100}.ev .bad{background:#fde8ec;color:#b3122e}
.ev span{flex:1;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev em{font-style:normal;color:var(--ink2);font-size:11.5px;white-space:nowrap}
.foot{padding-top:10px;color:var(--ink2);font-size:11.5px;line-height:1.45;border-top:1px solid var(--line);margin-top:10px}
.foot a{color:var(--ink);font-weight:600}

/* ---------- telefon po prawej: czarna obudowa w stylu najnowszego iPhone'a (bez logo) ---------- */
.right{position:relative;min-width:0;min-height:0}
.scaler{position:absolute;left:50%;top:50%;width:432px;height:904px;transform:translate(-50%,-50%) scale(var(--s,1))}
.device{position:relative;width:432px;height:904px;border-radius:72px;padding:12px;
  background:linear-gradient(145deg,#2b2c2f 0%,#4a4b4f 14%,#1b1c1e 38%,#2f3033 62%,#121214 84%,#3a3b3e 100%);
  box-shadow:0 0 0 1px #000,inset 0 0 1px 1px rgba(255,255,255,.18),0 50px 90px -20px rgba(10,15,30,.5),0 20px 40px -10px rgba(10,15,30,.35)}
.bezel{width:100%;height:100%;border-radius:61px;background:#000;padding:3px}
.screen{width:402px;height:874px;border-radius:58px;overflow:hidden;background:#ebedf2;position:relative}
.screen iframe{width:100%;height:100%;border:0;display:block}
.btn-s{position:absolute;width:5px;border-radius:3px;background:linear-gradient(90deg,#141416,#4b4c50 50%,#141416)}
.btn-s.l{left:-4px}.btn-s.r{right:-4px}
.b-action{top:178px;height:36px}.b-volup{top:240px;height:66px}.b-voldn{top:318px;height:66px}
.b-power{top:262px;height:104px}.b-cam{top:560px;height:62px;width:4px;right:-3px}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#ebedf2;transition:opacity .25s;pointer-events:none}
.loading.off{opacity:0}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #e1e3ea;border-top-color:var(--red);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.phonebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:700}
.phonebtn:hover{border-color:#c9ccd6}.phonebtn svg{width:18px;height:18px}
.qrpop{display:flex;gap:12px;align-items:center;margin-top:8px;padding:10px;border-radius:14px;background:var(--bg)}
.qrpop[hidden]{display:none}
#qrBox{width:104px;height:104px;flex-shrink:0;background:#fff;border-radius:10px;padding:4px}#qrBox svg{width:100%;height:100%;display:block}
.qrpop b{display:block;font-size:13.5px}.qrpop small{display:block;color:var(--ink2);font-size:12px;line-height:1.35;margin:3px 0 6px}
.qrpop a{color:var(--ink);font-size:12.5px;font-weight:600}
/* ---------- panel w dwóch kolumnach: osoba i data | terminy i kod QR — wszystko widać bez przewijania ---------- */
.stage{grid-template-columns:minmax(600px,760px) 1fr}
.panel{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.panel .kol{display:flex;flex-direction:column;min-height:0;min-width:0}
.panel .kol .foot{margin-top:auto}
.panel .h0{margin-top:4px}
.panel .events{flex:1}
/* zawsze dwie kolumny; panel zwęża się razem z oknem, telefon skaluje się do reszty miejsca */
.stage{grid-template-columns:clamp(520px,48vw,760px) 1fr;gap:16px;padding:14px 18px}
.panel{overflow:hidden}
.chips{flex-wrap:wrap}
/* węższy panel: osoby jedna pod drugą zamiast 2×2, nazwy terminów w dwóch linijkach zamiast ucinania */
.people{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.ev span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev i{min-width:0}
.chip{flex:1 0 auto;padding:5px 8px}
/* ---------- układ panelu: jedna kolumna od góry do dołu, bez pustych pól ----------
   osoby w jednym rzędzie · data · terminy (wypełniają resztę, w dwóch kolumnach) · na dole kod QR i informacja */
.panel{display:flex!important;flex-direction:column;overflow:hidden}
.people{grid-template-columns:repeat(4,1fr)!important;gap:8px}
.person{flex-direction:column;align-items:flex-start;gap:6px;padding:10px}
.person .av{width:34px;height:34px}
.person b,.person small{white-space:normal}
.datebox{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"d s" "c c";column-gap:16px;align-items:center}
.datebox .date{grid-area:d;flex-direction:column;align-items:flex-start;gap:0}
.datebox input[type=range]{grid-area:s;margin:0}
.datebox .chips{grid-area:c;margin-top:8px;flex-wrap:nowrap}
.events{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));align-content:start;gap:6px;flex:1;min-height:0;overflow:hidden}
.dol{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-top:12px}
.dol .qrpop{margin:0}
.dol .foot{border:0;margin:0;padding:0 0 4px;max-width:200px;text-align:right}
#qrBox{width:92px;height:92px}
/* panel ma wysokość swojej treści (bez pustych pól), ale nigdy nie wychodzi poza okno */
.stage{align-items:center}
.right{align-self:stretch}
.panel{height:auto;max-height:100%;align-self:center}
.events{flex:0 1 auto!important}
.dol{margin-top:14px}
.screen .ekr{position:absolute;inset:0;width:100%;height:100%}
.screen .ekr.ukryty{opacity:0;pointer-events:none}
/* zasłona ładowania: łagodne pojawienie i zniknięcie, nad obiema ramkami */
.loading{z-index:5;transition:opacity .22s ease}
.loading:not(.off){transition-duration:.15s}
/* płynne zaznaczenia w panelu */
.person,.chip{transition:background-color .25s ease,border-color .25s ease,color .25s ease,box-shadow .25s ease,transform .15s ease}
.person:active,.chip:active,.ev:active{transform:scale(.97)}
.person.on{box-shadow:0 4px 14px rgba(220,20,60,.14)}
.ev{transition:border-color .2s ease,transform .15s ease}
#dLabel,#dRel{display:inline-block}
/* data: [data] [krótki suwak] [+N dni] w jednym rzędzie */
.datebox{grid-template-columns:auto 1fr auto!important;grid-template-areas:"d s r" "c c c"!important;column-gap:14px}
.datebox #dRel{grid-area:r;color:var(--ink2);font-size:13px;font-weight:700;white-space:nowrap;text-align:left;width:var(--relw,64px)}   /* „+” zawsze w tej samej odległości od suwaka co data po lewej */
.datebox input[type=range]{min-width:120px}
.person.on{box-shadow:none}
/* panel sterowania bez animacji przejść */
.panel *{transition:none!important}
</style>
</head>
<body>
<div class="stage">
  <aside class="panel" aria-label="Panel pokazu">
    <div class="brand"><img src="assets/icon-app.svg" alt=""><h1>mObywatel</h1></div>

    <div class="h">Osoba</div>
    <div class="people" id="people"></div>

    <div class="h">Data w aplikacji</div>
    <div class="datebox">
      <div class="date"><b id="dLabel">—</b></div>
      <input type="range" id="slider" min="0" max="730" step="1" value="0" aria-label="Przesuń datę w aplikacji">
      <span id="dRel"></span>
      <div class="chips" id="quick"></div>
    </div>

    <div class="h">Terminy · podgląd stanu po upływie</div>
    <div class="events" id="events"></div>

    <div class="dol">
      <div class="qrpop" id="qrPop">
        <div id="qrBox" aria-label="Kod QR z linkiem do aplikacji"></div>
        <div><b>Otwórz na swoim telefonie</b><small>Zeskanuj aparatem — otworzy się ta sama osoba i data, bez panelu.</small>
        <a href="app.html" id="openApp" target="_blank" rel="noopener">albo otwórz w nowym oknie przeglądarki ↗</a></div>
      </div>
      <div class="foot">Osoby i dane są fikcyjne. To nie jest usługa administracji publicznej.</div>
    </div>
  </aside>

  <main class="right">
    <div class="scaler" id="scaler">
      <div class="device">
        <span class="btn-s l b-action"></span><span class="btn-s l b-volup"></span><span class="btn-s l b-voldn"></span>
        <span class="btn-s r b-power"></span><span class="btn-s r b-cam"></span>
        <div class="bezel"><div class="screen">
          <iframe id="app" class="ekr" title="Aplikacja na telefonie" src="about:blank"></iframe>
          <iframe id="app2" class="ekr ukryty" title="Aplikacja na telefonie" src="about:blank" aria-hidden="true" tabindex="-1"></iframe>
          <div class="loading" id="loading"><div class="spin"></div></div>
        </div></div>
      </div>
    </div>
  </main>
</div>

<script src="lib/qrcode.js"></script>
<script src="osoby.js?v=20261114-0112"></script>
<script>
/* =========================================================
   STAN POKAZU: osoba, dzień (przesunięcie od dnia 0), układ
   ========================================================= */
const DAY=864e5, DZIEN_0=new Date(2026,9,18);   // ta sama data co w czas.js
/* na ekranie dzień 0 = prawdziwe dziś: daty z danych wyświetlamy przesunięte o PRZES dni */
const DZIS=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})(), PRZES=Math.round((DZIS-DZIEN_0)/DAY);
const naEkran=d=>new Date(d.getTime()+PRZES*DAY);
/* WERSJA: zmieniana przy każdej zmianie aplikacji, żeby przeglądarka nie pokazywała starej kopii z pamięci */
const WERSJA='20261114-0112';
const q=new URLSearchParams(location.search);
const S={osoba:OSOBY[q.get('osoba')]?q.get('osoba'):'marta', dzien:Math.max(0,Math.min(730,+q.get('dzien')||0))};
const QUICK=[[0,'Dziś'],[14,'+2 tyg'],[30,'+1 m'],[90,'+3 m'],[180,'+6 m'],[365,'+1 rok']];
const $=s=>document.querySelector(s);
const fmt=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;   // dd/mm/rrrr
const fmtS=d=>d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'});
const dni=x=>x===1?'1 dzień':x+' dni';

/* terminy osoby wyciągnięte z danych (OC, badanie, ważność, płatności) */
function parse(t){const m=/(\d{2})\.(\d{2})(?:\.(\d{4}))?/.exec(t);if(!m)return null;const mo=+m[2];const y=m[3]?+m[3]:(mo>=7?2026:2027);return new Date(y,mo-1,+m[1])}
function events(id){
  const os=OSOBY[id],out=[],seen=new Set();
  const add=(label,txt)=>{const d=parse(txt);if(!d)return;const n=Math.round((d-DZIEN_0)/DAY);if(n<0||n>730)return;if(seen.has(n))return;seen.add(n);out.push({label,n,d})};
  /* najpierw przypomnienia z aplikacji (czytelne nazwy), potem daty z dokumentów; jeden wpis na dzień */
  (os.tiles||[]).forEach(t=>{if(/\d{2}\.\d{2}/.test(t.d||''))add(t.h,t.d)});
  os.docs.forEach(doc=>[...(doc.f||[]),...(doc.rows||[])].forEach(([k,v])=>{if(/ważn|^OC|^Badanie/i.test(k)&&typeof v==='string')add(`${doc.name}: ${k.replace(/ do$/,'').replace(/^Dowód ważny$/,'ważność')}`,v)}));
  return out.sort((a,b)=>a.n-b.n);
}

/* Panel aktualizuje się płynnie: osoby i przyciski tylko zmieniają zaznaczenie (bez przebudowy),
   data i terminy delikatnie się przenikają, a kod QR „miga” miękko przy zmianie. */
const SPOK=matchMedia('(prefers-reduced-motion: reduce)').matches;
let ciagnie=false,poprz={osoba:null,dzien:null,tekst:null};
const miekko=()=>{};   /* panel bez animacji */
/* szerokość pola „+N dni” = najdłuższa wartość („+730 dni”), żeby suwak nie skakał, a odstęp po „+” był stały */
function szerRel(){const r=$('#dRel');if(!r)return;const t=r.textContent;r.style.width='auto';r.textContent='+730 dni';const w=Math.ceil(r.getBoundingClientRect().width);r.textContent=t;document.documentElement.style.setProperty('--relw',w+'px');r.style.width=''}
function render(){
  const pe=$('#people');
  if(!pe.children.length)pe.innerHTML=Object.values(OSOBY).map(o=>`<button class="person" data-o="${o.id}"><span class="av" style="background-image:url(assets/foto-${o.id}.svg)"></span><span><b>${o.imie} ${o.nazwisko}</b><small>${o.opis.split(',').slice(0,2).join(',')}</small></span></button>`).join('');
  pe.querySelectorAll('.person').forEach(b=>{const on=b.dataset.o===S.osoba;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  const d=new Date(DZIS.getTime()+S.dzien*DAY),txt=fmt(d);
  if($('#dLabel').textContent!==txt){$('#dLabel').textContent=txt;if(!ciagnie)miekko($('#dLabel'))}
  const rel=`+${dni(S.dzien)}`;if($('#dRel').textContent!==rel){$('#dRel').textContent=rel;if(!ciagnie)miekko($('#dRel'))}
  $('#slider').value=S.dzien;
  const qk=$('#quick');
  if(!qk.children.length)qk.innerHTML=QUICK.map(([n,l])=>`<button class="chip" data-d="${n}">${l}</button>`).join('');
  qk.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',+b.dataset.d===S.dzien));
  const ev=events(S.osoba);
  const html=ev.length?ev.map(e=>{const x=e.n-S.dzien;const cls=x<0?'bad':x<=30?'warn':'ok';const t=x<0?`${dni(-x)} po`:x===0?'dziś':`za ${dni(x)}`;
    return `<button class="ev" data-d="${e.n+1}" title="Pokaż stan w dniu następującym po terminie"><i class="${cls}">${t}</i><span>${e.label}</span><em>${fmtS(naEkran(e.d))}</em></button>`}).join(''):'<p class="hint">Brak terminów w najbliższych 2 latach.</p>';
  const box=$('#events'),nowaOsoba=poprz.osoba!==null&&poprz.osoba!==S.osoba;
  if(html!==poprz.tekst){box.innerHTML=html;poprz.tekst=html;fitEvents();
}
  poprz.osoba=S.osoba;poprz.dzien=S.dzien;
}
/* lista terminów: pokaż tyle, ile się zmieści (bez przewijania) — najpierw najbliższe nadchodzące */
function fitEvents(){const box=$('#events');const items=[...box.children];if(!items.length)return;
  const up=items.filter(e=>!e.querySelector('i.bad')),past=items.filter(e=>e.querySelector('i.bad')).reverse();
  box.innerHTML='';[...up,...past].forEach(e=>box.append(e));
  while(box.children.length>1&&box.scrollHeight>box.clientHeight+1)box.lastElementChild.remove();
  [...box.children].sort((a,b)=>+a.dataset.d-+b.dataset.d).forEach(e=>box.append(e));}
const MOTYW='';   /* motyw „urzędowy” jest domyślny w app.html */
function appURL(){return `app.html?osoba=${S.osoba}&dzien=${S.dzien}${MOTYW?'&motyw='+MOTYW:''}&v=${WERSJA}`}
let last='';
/* Płynna zmiana: nowa wersja aplikacji ładuje się w drugiej, ukrytej ramce, a gdy jest gotowa,
   przenika się z obecną (bez białego ekranu i „zacięcia”). */
let ramA=$('#app'),ramB=$('#app2'),pierwszy=true,nrLad=0;
function load(){
  const u=appURL(); if(u===last)return; last=u;
  $('#openApp').href=u; rysujQR();
  history.replaceState(null,'',`?osoba=${S.osoba}&dzien=${S.dzien}${MOTYW?'&motyw='+MOTYW:''}`);
  if(pierwszy){ramA.src=u;return}
  /* krótki ekran ładowania przy każdej zmianie: zasłona wjeżdża, pod nią podmieniamy aplikację,
     zasłona znika najwcześniej po MIN ms — bez skakania między widokami */
  const nr=++nrLad,start=performance.now(),MIN=550;
  $('#loading').classList.remove('off');
  ramB.onload=()=>{if(nr!==nrLad)return;const reszta=Math.max(0,MIN-(performance.now()-start));
    setTimeout(()=>{if(nr!==nrLad)return;zamien();requestAnimationFrame(()=>$('#loading').classList.add('off'))},reszta)};
  ramB.src=u;
}
function zamien(){
  const nowa=ramB,stara=ramA;
  nowa.classList.remove('ukryty');nowa.removeAttribute('aria-hidden');nowa.removeAttribute('tabindex');
  stara.classList.add('ukryty');stara.setAttribute('aria-hidden','true');stara.tabIndex=-1;stara.src='about:blank';
  ramA=nowa;ramB=stara;synchronizuj();
}
function synchronizuj(){
  /* osoba zmieniona wewnątrz aplikacji → zsynchronizuj panel */
  try{const p=new URLSearchParams(ramA.contentWindow.location.search).get('osoba');if(p&&OSOBY[p]&&p!==S.osoba){S.osoba=p;last=appURL();render();history.replaceState(null,'',`?osoba=${S.osoba}&dzien=${S.dzien}${MOTYW?'&motyw='+MOTYW:''}`)}}catch(e){}
}
ramA.addEventListener('load',()=>{if(pierwszy&&ramA.src!=='about:blank'){pierwszy=false;$('#loading').classList.add('off');synchronizuj()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-o],[data-d]'); if(!b)return;
  if(b.dataset.o)S.osoba=b.dataset.o;
  if(b.dataset.d!==undefined)S.dzien=Math.min(730,+b.dataset.d);
  render(); load();
});
const sl=$('#slider');

sl.addEventListener('change',()=>{ciagnie=false;S.dzien=+sl.value;load()});      // przeładuj telefon po puszczeniu

/* „Otwórz na swoim telefonie”: kod QR z adresem samej aplikacji (bieżąca osoba i data) */
function rysujQR(){const box=$('#qrBox');if(!box||$('#qrPop').hidden)return;
  const url=new URL(appURL(),location.href).href;const q=qrcode(0,'M');q.addData(url);q.make();
  const nowy=q.createSvgTag({cellSize:4,margin:2,scalable:true});
  if(!box.innerHTML||SPOK){box.innerHTML=nowy;return}
  /* spokojna zmiana kodu: krótkie przygaszenie i podmiana */
  box.innerHTML=nowy;}
/* „albo otwórz w nowym oknie przeglądarki”: osobne okno w rozmiarze iPhone'a 16 (393×852), czyli widok mobilny na komputerze */
$('#openApp').addEventListener('click',e=>{
  const w=393,h=852,l=Math.max(0,(screen.availWidth-w)/2),t=Math.max(0,(screen.availHeight-h)/2);
  const okno=window.open($('#openApp').href,'mobywatel_telefon',`popup=yes,width=${w},height=${h},left=${l},top=${t}`);
  if(okno){e.preventDefault();okno.focus()}           // gdy przeglądarka zablokuje okno — otworzy się zwykła karta
});
/* telefon zawsze mieści się w oknie */
function fit(){const r=$('.right').getBoundingClientRect();const s=Math.min(1,(r.height-8)/904,(r.width-8)/432);$('#scaler').style.setProperty('--s',s)}
addEventListener('resize',()=>{fit();render()});
