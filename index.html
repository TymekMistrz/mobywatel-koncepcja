<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mObywatel</title>
<link rel="icon" href="assets/icon-app.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Na telefonie nie pokazujemy ramki — od razu sama aplikacja */
if(Math.min(innerWidth,screen.width)<820)location.replace('app.html'+location.search);
</script>
<style>
/* =========================================================
   WYGLĄD PANELU I RAMKI — kolory zmieniasz tutaj
   ========================================================= */
:root{--red:#dc143c;--ink:#16181d;--ink2:#5d6472;--line:#e4e6ec;--bg:#f1f2f6;--card:#fff;--sans:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(1200px 700px at 72% 45%,#ffffff 0%,#e9ebf0 55%,#dcdfe6 100%);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #f5b700;outline-offset:2px;border-radius:10px}

.stage{height:100vh;display:grid;grid-template-columns:minmax(340px,400px) 1fr;gap:20px;padding:16px 24px}

/* ---------- panel po lewej: wszystko mieści się bez przewijania ---------- */
.panel{background:var(--card);border-radius:22px;box-shadow:0 10px 40px rgba(20,30,60,.10);padding:16px 18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:30px;height:30px}
.brand h1{font-size:15.5px;line-height:1.2;margin:0}
.h{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:14px 2px 7px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.person{display:flex;gap:9px;align-items:center;text-align:left;padding:7px 9px;border-radius:13px;border:2px solid var(--line);background:#fff;min-width:0}
.person:hover{border-color:#c9ccd6}
.person.on{border-color:var(--red);background:#fff5f7}
.person .av{width:32px;height:32px;border-radius:50%;background:#dfe4ee center 20%/cover;flex-shrink:0}
.person span{min-width:0}
.person b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person small{display:block;color:var(--ink2);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.datebox{background:var(--bg);border-radius:14px;padding:11px 13px 12px}
.date{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.date b{font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.date span{color:var(--ink2);font-size:12px;font-weight:700;white-space:nowrap}
input[type=range]{width:100%;margin:8px 0 4px;accent-color:var(--red);height:22px}
.chips{display:flex;gap:5px}
.chip{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 0;font-size:12px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.events{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;overflow:hidden}
.ev{display:flex;gap:9px;align-items:center;text-align:left;padding:7px 10px;border-radius:11px;background:#fff;border:1.5px solid var(--line);font-size:13px;flex-shrink:0}
.ev:hover{border-color:#c9ccd6}
.ev i{font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:3px 7px;white-space:nowrap;min-width:68px;text-align:center}
.ev .ok{background:#e7f4ea;color:#1b7a3d}.ev .warn{background:#fff3dc;color:#8a5100}.ev .bad{background:#fde8ec;color:#b3122e}
.ev span{flex:1;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev em{font-style:normal;color:var(--ink2);font-size:11.5px;white-space:nowrap}
.foot{padding-top:10px;color:var(--ink2);font-size:11.5px;line-height:1.45;border-top:1px solid var(--line);margin-top:10px}
.foot a{color:var(--ink);font-weight:600}

/* ---------- telefon po prawej: czarna obudowa w stylu najnowszego iPhone'a (bez logo) ---------- */
.right{position:relative;min-width:0;min-height:0}
.scaler{position:absolute;left:50%;top:50%;width:432px;height:904px;transform:translate(-50%,-50%) scale(var(--s,1))}
.device{position:relative;width:432px;height:904px;border-radius:72px;padding:12px;
  background:linear-gradient(145deg,#2b2c2f 0%,#4a4b4f 14%,#1b1c1e 38%,#2f3033 62%,#121214 84%,#3a3b3e 100%);
  box-shadow:0 0 0 1px #000,inset 0 0 1px 1px rgba(255,255,255,.18),0 50px 90px -20px rgba(10,15,30,.5),0 20px 40px -10px rgba(10,15,30,.35)}
.bezel{width:100%;height:100%;border-radius:61px;background:#000;padding:3px}
.screen{width:402px;height:874px;border-radius:58px;overflow:hidden;background:#f2f3f7;position:relative}
.screen iframe{width:100%;height:100%;border:0;display:block}
.btn-s{position:absolute;width:5px;border-radius:3px;background:linear-gradient(90deg,#141416,#4b4c50 50%,#141416)}
.btn-s.l{left:-4px}.btn-s.r{right:-4px}
.b-action{top:178px;height:36px}.b-volup{top:240px;height:66px}.b-voldn{top:318px;height:66px}
.b-power{top:262px;height:104px}.b-cam{top:560px;height:62px;width:4px;right:-3px}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#f2f3f7;transition:opacity .25s;pointer-events:none}
.loading.off{opacity:0}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid #e1e3ea;border-top-color:var(--red);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.phonebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;font-weight:700}
.phonebtn:hover{border-color:#c9ccd6}.phonebtn svg{width:18px;height:18px}
.qrpop{display:flex;gap:12px;align-items:center;margin-top:8px;padding:10px;border-radius:14px;background:var(--bg)}
.qrpop[hidden]{display:none}
#qrBox{width:104px;height:104px;flex-shrink:0;background:#fff;border-radius:10px;padding:4px}#qrBox svg{width:100%;height:100%;display:block}
.qrpop b{display:block;font-size:13.5px}.qrpop small{display:block;color:var(--ink2);font-size:12px;line-height:1.35;margin:3px 0 6px}
.qrpop a{color:var(--ink);font-size:12.5px;font-weight:600}
</style>
</head>
<body>
<div class="stage">
  <aside class="panel" aria-label="Panel pokazu">
    <div class="brand"><img src="assets/icon-app.svg" alt=""><h1>mObywatel</h1></div>

    <div class="h">Osoba</div>
    <div class="people" id="people"></div>

    <div class="h">Data w aplikacji</div>
    <div class="datebox">
      <div class="date"><b id="dLabel">—</b><span id="dRel"></span></div>
      <input type="range" id="slider" min="0" max="730" step="1" value="0" aria-label="Przesuń datę w aplikacji">
      <div class="chips" id="quick"></div>
    </div>

    <div class="h">Terminy · podgląd stanu po upływie</div>
    <div class="events" id="events"></div>

    <div class="foot">Osoby i dane są fikcyjne. To nie jest usługa administracji publicznej.
      </div>
    <button class="phonebtn" id="phoneBtn" aria-expanded="false" aria-controls="qrPop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>Otwórz na swoim telefonie</button>
    <div class="qrpop" id="qrPop" hidden>
      <div id="qrBox" aria-label="Kod QR z linkiem do aplikacji"></div>
      <div><b>Zeskanuj aparatem telefonu</b><small>Otworzy się ta sama osoba i data, bez panelu.</small>
      <a href="app.html" id="openApp" target="_blank" rel="noopener">albo otwórz w nowej karcie ↗</a></div>
    </div>
  </aside>

  <main class="right">
    <div class="scaler" id="scaler">
      <div class="device">
        <span class="btn-s l b-action"></span><span class="btn-s l b-volup"></span><span class="btn-s l b-voldn"></span>
        <span class="btn-s r b-power"></span><span class="btn-s r b-cam"></span>
        <div class="bezel"><div class="screen">
          <iframe id="app" title="Aplikacja na telefonie" src="about:blank"></iframe>
          <div class="loading" id="loading"><div class="spin"></div></div>
        </div></div>
      </div>
    </div>
  </main>
</div>

<script src="lib/qrcode.js"></script>
<script src="osoby.js?v=20261111-1616"></script>
<script>
/* =========================================================
   STAN POKAZU: osoba, dzień (przesunięcie od dnia 0), układ
   ========================================================= */
const DAY=864e5, DZIEN_0=new Date(2026,9,18);   // ta sama data co w czas.js
/* WERSJA: zmieniana przy każdej zmianie aplikacji, żeby przeglądarka nie pokazywała starej kopii z pamięci */
const WERSJA='20261111-1616';
const q=new URLSearchParams(location.search);
const S={osoba:OSOBY[q.get('osoba')]?q.get('osoba'):'marta', dzien:Math.max(0,Math.min(730,+q.get('dzien')||0))};
const QUICK=[[0,'Start'],[14,'+2 tyg.'],[30,'+1 m.'],[90,'+3 m.'],[180,'+6 m.'],[365,'+1 rok']];
const $=s=>document.querySelector(s);
const fmt=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;   // dd/mm/rrrr
const fmtS=d=>d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'});
const dni=x=>x===1?'1 dzień':x+' dni';

/* terminy osoby wyciągnięte z danych (OC, badanie, ważność, płatności) */
function parse(t){const m=/(\d{2})\.(\d{2})(?:\.(\d{4}))?/.exec(t);if(!m)return null;const mo=+m[2];const y=m[3]?+m[3]:(mo>=7?2026:2027);return new Date(y,mo-1,+m[1])}
function events(id){
  const os=OSOBY[id],out=[],seen=new Set();
  const add=(label,txt)=>{const d=parse(txt);if(!d)return;const n=Math.round((d-DZIEN_0)/DAY);if(n<0||n>730)return;if(seen.has(n))return;seen.add(n);out.push({label,n,d})};
  /* najpierw przypomnienia z aplikacji (czytelne nazwy), potem daty z dokumentów; jeden wpis na dzień */
  (os.tiles||[]).forEach(t=>{if(/\d{2}\.\d{2}/.test(t.d||''))add(t.h,t.d)});
  os.docs.forEach(doc=>[...(doc.f||[]),...(doc.rows||[])].forEach(([k,v])=>{if(/ważn|^OC|^Badanie/i.test(k)&&typeof v==='string')add(`${doc.name}: ${k.replace(/ do$/,'').replace(/^Dowód ważny$/,'ważność')}`,v)}));
  return out.sort((a,b)=>a.n-b.n);
}

function render(){
  $('#people').innerHTML=Object.values(OSOBY).map(o=>`<button class="person ${o.id===S.osoba?'on':''}" data-o="${o.id}" aria-pressed="${o.id===S.osoba}"><span class="av" style="background-image:url(assets/foto-${o.id}.svg)"></span><span><b>${o.imie} ${o.nazwisko}</b><small>${o.opis.split(',').slice(0,2).join(',')}</small></span></button>`).join('');
  const d=new Date(DZIEN_0.getTime()+S.dzien*DAY);
  $('#dLabel').textContent=fmt(d);
  $('#dRel').textContent=S.dzien?`+${dni(S.dzien)}`:'';
  $('#slider').value=S.dzien;
  $('#quick').innerHTML=QUICK.map(([n,l])=>`<button class="chip ${S.dzien===n?'on':''}" data-d="${n}">${l}</button>`).join('');
  const ev=events(S.osoba);
  $('#events').innerHTML=ev.length?ev.map(e=>{const x=e.n-S.dzien;const cls=x<0?'bad':x<=30?'warn':'ok';const t=x<0?`${dni(-x)} po`:x===0?'dziś':`za ${dni(x)}`;
    return `<button class="ev" data-d="${e.n+1}" title="Pokaż stan w dniu następującym po terminie"><i class="${cls}">${t}</i><span>${e.label}</span><em>${fmtS(e.d)}</em></button>`}).join(''):'<p class="hint">Brak terminów w najbliższych 2 latach.</p>';
  fitEvents();
}
/* lista terminów: pokaż tyle, ile się zmieści (bez przewijania) — najpierw najbliższe nadchodzące */
function fitEvents(){const box=$('#events');const items=[...box.children];if(!items.length)return;
  const up=items.filter(e=>!e.querySelector('i.bad')),past=items.filter(e=>e.querySelector('i.bad')).reverse();
  box.innerHTML='';[...up,...past].forEach(e=>box.append(e));
  while(box.children.length>1&&box.scrollHeight>box.clientHeight+1)box.lastElementChild.remove();
  [...box.children].sort((a,b)=>+a.dataset.d-+b.dataset.d).forEach(e=>box.append(e));}
function appURL(){return `app.html?osoba=${S.osoba}&dzien=${S.dzien}&v=${WERSJA}`}
let last='';
function load(){
  const u=appURL(); if(u===last)return; last=u;
  $('#loading').classList.remove('off'); $('#app').src=u;
  $('#openApp').href=u; rysujQR();
  history.replaceState(null,'',`?osoba=${S.osoba}&dzien=${S.dzien}`);
}
$('#app').addEventListener('load',()=>{
  $('#loading').classList.add('off');
  /* osoba zmieniona w menu wewnątrz aplikacji → zsynchronizuj panel */
  try{const p=new URLSearchParams($('#app').contentWindow.location.search).get('osoba');if(p&&OSOBY[p]&&p!==S.osoba){S.osoba=p;last=appURL();render();history.replaceState(null,'',`?osoba=${S.osoba}&dzien=${S.dzien}`)}}catch(e){}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-o],[data-d]'); if(!b)return;
  if(b.dataset.o)S.osoba=b.dataset.o;
  if(b.dataset.d!==undefined)S.dzien=Math.min(730,+b.dataset.d);
  render(); load();
});
const sl=$('#slider');
sl.addEventListener('input',()=>{S.dzien=+sl.value;render()});      // podgląd daty na żywo
sl.addEventListener('change',()=>{S.dzien=+sl.value;load()});      // przeładuj telefon po puszczeniu

/* „Otwórz na swoim telefonie”: kod QR z adresem samej aplikacji (bieżąca osoba i data) */
function rysujQR(){const box=$('#qrBox');if(!box||$('#qrPop').hidden)return;
  const url=new URL(appURL(),location.href).href;const q=qrcode(0,'M');q.addData(url);q.make();
  box.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});}
$('#phoneBtn').addEventListener('click',()=>{const p=$('#qrPop');p.hidden=!p.hidden;$('#phoneBtn').setAttribute('aria-expanded',String(!p.hidden));rysujQR();render()});
/* telefon zawsze mieści się w oknie */
function fit(){const r=$('.right').getBoundingClientRect();const s=Math.min(1,(r.height-8)/904,(r.width-8)/432);$('#scaler').style.setProperty('--s',s)}
addEventListener('resize',()=>{fit();render()});
render(); load(); fit();
</script>
</body>
</html>
